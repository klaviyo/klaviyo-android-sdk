# A workflow for controlling the actions taken by CI for pull requests and master branch

name: Android SDK CI

# Triggers the workflow on pull requests and when code is merged into master
on:
  pull_request:
  push:
    branches:
      - 'master'

env:
  SLACK_USERNAME: Android SDK
  SLACK_ICON_EMOJI: ':merlin-orb-android:'

jobs:
  # A job for running our tests
  test:
    name: Run Unit Tests

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        module: [ ':sdk:analytics', ':sdk:core', ':sdk:forms-core', ':sdk:forms', ':sdk:location-core', ':sdk:location', ':sdk:push-fcm' ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android Build Environment
        uses: ./.github/actions/setup
        with:
          google-services-json: ${{secrets.GOOGLE_SERVICES_JSON}}

      # Call Gradle to run the unit tests
      - name: Unit Tests
        run: ./gradlew ${{ matrix.module }}:test --stacktrace --no-daemon

  # A job for running linters (ktlint + Android Lint)
  lint:
    name: Run Linters

    # The type of runner that the job will run on
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android Build Environment
        uses: ./.github/actions/setup
        with:
          google-services-json: ${{secrets.GOOGLE_SERVICES_JSON}}

      # Call Gradle to run ktlint check
      - name: Ktlint Check
        run: ./gradlew ktlintCheck --no-daemon

      # Call Gradle to run Android Lint
      - name: Android Lint
        run: ./gradlew lintRelease --no-daemon

  # Posts one Slack message when tests or lint fail on a master push
  notify:
    name: Notify Slack
    needs: [ test, lint ]
    if: failure() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Record commit
        id: commit
        run: echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          sparse-checkout: .github/actions

      - name: Summarize failures
        id: summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: |
          lines=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' 2> /dev/null || true)
          if [ -z "$lines" ]; then
            if [ "$TEST_RESULT" = "failure" ]; then lines+="Run Unit Tests"$'\n'; fi
            if [ "$LINT_RESULT" = "failure" ]; then lines+="Run Linters"$'\n'; fi
          fi
          {
            echo "body<<EOF_BODY"
            printf '%s\n' "$lines" | sed -e '/^$/d' -e 's/^/• `/' -e 's/$/`/'
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Slack
        continue-on-error: true
        uses: ./.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          status: failure
          title: Android CI failed on `master`
          body: ${{ steps.summary.outputs.body }}
          fields: |
            Repository: ${{ github.repository }}
            Commit: `${{ steps.commit.outputs.short_sha }}`
            Author: ${{ github.actor }}
          links: Commit|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
