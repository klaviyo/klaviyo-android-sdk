# Workflow for running Android instrumented tests across multiple API levels
# Runs on master, release branches, PRs with specific labels, and PRs that touch the inbox module

name: Instrumented Tests

# Required permissions for label management
permissions:
  contents: read
  pull-requests: write

# Trigger conditions
on:
  # Run on pushes to main branches
  push:
    branches:
      - 'master'
      - 'rel/*'

  # Run on PR updates so path-triggered runs see new commits, and when labels are added
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]

# A newer commit on a PR replaces the run for the older one. Pushes to branches always finish.
# A label other than test:all starts no tests, so it gets a group of its own and cannot cancel a
# run that is still going.
concurrency:
  group: >-
    instrumented-tests-${{ github.event.pull_request.number || github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'test:all' && '-unrelated-label' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the instrumented tests run, and which tasks and API levels they cover:
  #   - pushes to master and rel/*, and PRs labeled test:all: every suite (sample, core, inbox) on every API level
  #   - other PRs that touch the inbox module or its build setup: the inbox suite on API 23
  #   - everything else: nothing
  changes:
    name: Select Tests
    runs-on: ubuntu-22.04
    # Labeling a PR with anything but test:all starts no run, so a later label cannot report a second
    # result for a commit that already has one
    if: github.event.action != 'labeled' || github.event.label.name == 'test:all'
    outputs:
      run: ${{ steps.select.outputs.run }}
      matrix: ${{ steps.select.outputs.matrix }}
      tasks: ${{ steps.select.outputs.tasks }}
    steps:
      - name: Select tests
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HAS_ALL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'test:all') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$HAS_ALL_LABEL" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo 'matrix=[{"api-level":23,"arch":"x86"},{"api-level":36,"arch":"x86_64"}]' >> "$GITHUB_OUTPUT"
            echo "tasks=:sample:connectedAndroidTest :sdk:core:connectedAndroidTest :sdk:inbox:connectedAndroidTest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -qE '^(sdk/inbox(-core)?/|versions\.properties$|build\.gradle\.kts$|sdk/build\.gradle\.kts$|\.github/workflows/instrumented-tests\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo 'matrix=[{"api-level":23,"arch":"x86"}]' >> "$GITHUB_OUTPUT"
            echo "tasks=:sdk:inbox:connectedAndroidTest" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Main instrumented tests job
  instrumented-tests:
    name: Run
    runs-on: ubuntu-22.04
    needs: changes

    if: needs.changes.outputs.run == 'true'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Android Build Environment
        uses: ./.github/actions/setup
        with:
          google-services-json: ${{secrets.GOOGLE_SERVICES_JSON}}

      - name: Configure local.properties for instrumented tests
        run: |
          echo "klaviyoPublicApiKey=$INSTRUMENTED_TEST_PUBLIC_API_KEY" >> local.properties
        env:
          INSTRUMENTED_TEST_PUBLIC_API_KEY: ${{secrets.INSTRUMENTED_TEST_PUBLIC_API_KEY}}

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set API Level and Architecture
        id: api-setup
        run: |
          echo "api_level=${{ matrix.api-level }}" >> $GITHUB_OUTPUT
          echo "arch=${{ matrix.arch }}" >> $GITHUB_OUTPUT

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ steps.api-setup.outputs.api_level }}-${{ steps.api-setup.outputs.arch }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.api-setup.outputs.api_level }}
          arch: ${{ steps.api-setup.outputs.arch }}
          target: ${{ steps.api-setup.outputs.api_level >= 30 && 'google_apis' || 'default' }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.api-setup.outputs.api_level }}
          arch: ${{ steps.api-setup.outputs.arch }}
          target: ${{ steps.api-setup.outputs.api_level >= 30 && 'google_apis' || 'default' }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Running instrumented tests on API ${{ steps.api-setup.outputs.api_level }}"
            ./gradlew ${{ needs.changes.outputs.tasks }} --stacktrace --no-daemon
            echo "Instrumented tests completed"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-api-${{ steps.api-setup.outputs.api_level }}-${{ steps.api-setup.outputs.arch }}
          path: |
            sample/build/reports/androidTests/connected/
            sample/build/outputs/androidTest-results/
            sdk/core/build/reports/androidTests/connected/
            sdk/core/build/outputs/androidTest-results/
            sdk/inbox/build/reports/androidTests/connected/
            sdk/inbox/build/outputs/androidTest-results/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-api-${{ steps.api-setup.outputs.api_level }}-${{ steps.api-setup.outputs.arch }}
          path: sample/build/test-results/
          retention-days: 7

      - name: Send Slack notification on push failure
        if: failure() && github.event_name == 'push'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 Instrumented Tests Failed on ${{ github.event.pull_request.head.ref || github.ref_name }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨 Instrumented Tests Failed\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Repository:* ${{ github.repository }}\n*Branch:* `${{ github.event.pull_request.head.ref || github.ref_name }}`\n*API Level:* ${{ steps.api-setup.outputs.api_level }}\n*Architecture:* ${{ steps.api-setup.outputs.arch }}\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"

      - name: Update PR labels on success
        if: success() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test:all')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "test:all"

      - name: Update PR labels on failure
        if: failure() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test:all')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "test:all"

  # Reports a single, fixed check name whether the tests ran or were skipped, so it can be a
  # required status check. The matrix job above is named by API level and reports a different name
  # when skipped, so requiring it directly would leave PRs that skip it waiting forever.
  instrumented-tests-result:
    name: Instrumented Tests Result
    needs: [ changes, instrumented-tests ]
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'test:all')
    runs-on: ubuntu-22.04
    steps:
      - name: Check the instrumented test outcome
        env:
          SELECT_RESULT: ${{ needs.changes.result }}
          TESTS_RESULT: ${{ needs.instrumented-tests.result }}
        run: |
          [ "$SELECT_RESULT" = "success" ] || exit 1
          case "$TESTS_RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
