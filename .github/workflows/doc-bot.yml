# Generate release docs and commit to documentation branch (which is published to github pages)
name: Documentation Bot

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      slack_thread_ts:
        description: Slack message ts to reply under (set by publish-release.yml)
        required: false
        type: string
        default: ''

env:
  SLACK_USERNAME: Android SDK
  SLACK_ICON_EMOJI: ':merlin-orb-android:'

jobs:
  dokka:
    name: Generate and Publish Documentation
    runs-on: ubuntu-22.04
    env:
      CI_COMMIT_MESSAGE: Generated docs for ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GH_ACTION_ACCESS_TOKEN }}

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: documentation
          fetch-depth: 0
          token: ${{ secrets.GH_ACTION_ACCESS_TOKEN }}

      - name: Git config
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin master

      - name: Merge latest from master
        run: |
          git merge origin/master --commit --no-edit --strategy-option theirs

      - name: Add Google Services from Secrets
        run: 'echo "$GOOGLE_SERVICES_JSON" > ./sample/google-services.json'
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{secrets.GOOGLE_SERVICES_JSON}}

      - name: Generate Dokka documentation
        run: |
          ./gradlew dokkaHtmlMultiModule
          git add ./docs

      - name: Commit and push documentation
        id: push
        run: |
          if [ $(git status -s -uno | wc -l) -eq 0 ]; then
            echo "No documentation to change"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for Pages build
        id: pages
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          PUSHED_SHA: ${{ steps.push.outputs.sha }}
        run: |
          result=timeout
          for _ in $(seq 1 20); do
            STATUS=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds?per_page=10" 2>/dev/null \
              | jq -r --arg sha "$PUSHED_SHA" 'first(.[] | select(.commit == $sha) | .status) // ""' || true)
            if [ "$STATUS" == "built" ] || [ "$STATUS" == "errored" ]; then
              result=$STATUS
              break
            fi
            sleep 30
          done
          echo "Pages build result: $result"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Checkout Slack action
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions
          path: _slack

      - name: Send Slack notification on docs live
        if: always() && steps.push.outputs.pushed == 'true' && steps.pages.outputs.result == 'built'
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: success
          title: Android SDK `${{ github.ref_name }}` docs live on GitHub Pages
          links: Docs|https://klaviyo.github.io/klaviyo-android-sdk/

      - name: Send Slack notification on no docs changes
        if: always() && steps.push.outputs.pushed == 'false' && inputs.slack_thread_ts != ''
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: info
          title: Android SDK `${{ github.ref_name }}` docs unchanged, nothing to publish

      - name: Send Slack notification on Pages build problem
        if: always() && steps.push.outputs.pushed == 'true' && steps.pages.outputs.result != 'built'
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: failure
          title: Android SDK `${{ github.ref_name }}` docs Pages build ${{ steps.pages.outputs.result == 'timeout' && 'did not finish in 10 minutes' || 'failed' }}
          body: Docs were pushed to the `documentation` branch, but GitHub Pages did not report a successful build.
          links: Docs|https://klaviyo.github.io/klaviyo-android-sdk/

      - name: Send Slack notification on failure
        if: failure()
        continue-on-error: true
        uses: ./_slack/.github/actions/notify-slack
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          thread_ts: ${{ inputs.slack_thread_ts }}
          status: failure
          title: '`Documentation Bot` workflow failed'
          body: "Common issue: check whether `GH_ACTION_ACCESS_TOKEN` has expired."
          fields: |
            Repository: ${{ github.repository }}
            Ref: `${{ github.ref_name }}`
            Event: `${{ github.event_name }}`
