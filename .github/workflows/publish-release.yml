name: Publish Release

# Drafts a release after preflight checks, then publishes it once approved
# in the `release` environment. Publishing creates the tag, which is what
# JitPack builds from.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (X.Y.Z)
        required: true
        type: string
      ref:
        description: Branch or commit to release from
        required: false
        type: string
        default: master

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Preflight and Draft
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      checks: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      release_url: ${{ steps.draft.outputs.release_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version format
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not X.Y.Z"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve commit
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check tag does not exist
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Check strings.xml version matches
        run: |
          STRINGS_VERSION=$(grep -o '<string name="klaviyo_sdk_version_override">[^<]*</string>' sdk/core/src/main/res/values/strings.xml | sed 's/.*>\([^<]*\)<.*/\1/')
          if [ "$VERSION" != "$STRINGS_VERSION" ]; then
            echo "::error::Version mismatch: requested $VERSION, strings.xml has $STRINGS_VERSION. Run ./bump-version.sh on the release branch."
            exit 1
          fi
          echo "✅ strings.xml version matches $VERSION"

      - name: Check CI is green on the commit
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          OWN_SUITE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.check_suite_id')
          RUNS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq ".check_runs[] | select(.check_suite.id != $OWN_SUITE) | {name, status, conclusion}" | jq -s '.')
          TOTAL=$(jq 'length' <<<"$RUNS")
          BAD=$(jq -r '.[] | select(.status != "completed" or (.conclusion | IN("success", "skipped", "neutral") | not)) | "\(.name): \(.status)/\(.conclusion)"' <<<"$RUNS")
          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No check runs found on $SHA"
            exit 1
          fi
          if [ -n "$BAD" ]; then
            echo "::error::Checks on $SHA are not all green"
            echo "$BAD"
            exit 1
          fi
          echo "✅ $TOTAL check runs green on $SHA"

      - name: Find or create draft release
        id: draft
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          if IS_DRAFT=$(gh release view "$VERSION" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $VERSION is already published"
              exit 1
            fi
            echo "Reusing existing draft release $VERSION; notes left as written"
          else
            gh release create "$VERSION" --draft --generate-notes --title "$VERSION" --target "$SHA"
          fi
          URL=$(gh release view "$VERSION" --json url --jq '.url')
          echo "release_url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Release $VERSION awaiting approval"
            echo
            echo "- Commit: \`$SHA\`"
            echo "- Draft release: $URL"
            echo
            echo "Review and edit the draft notes, then approve the \`release\` environment on this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack release awaiting approval
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "⏳ Android SDK ${{ inputs.version }} awaiting release approval"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "⏳ *Android SDK `${{ inputs.version }}` awaiting release approval*\n*Draft release:* <${{ steps.draft.outputs.release_url }}|Review notes>\n*Commit:* `${{ steps.resolve.outputs.sha }}`\n*Started by:* ${{ github.actor }}"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Approve here>"

  publish:
    name: Publish Release
    needs: prepare
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Publish draft release
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --target "$SHA"

      - name: Dispatch downstream workflows at the tag
        run: |
          for WORKFLOW in jitpack.yml version-guard.yml doc-bot.yml; do
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$VERSION"
            echo "Dispatched $WORKFLOW at $VERSION"
          done
          {
            echo "### Release $VERSION published"
            echo
            echo "Dispatched jitpack.yml, version-guard.yml and doc-bot.yml at \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
