name: JitPack

# Required permissions for label management
permissions:
  contents: read
  pull-requests: write

on:
  release:
    types: [ published ]
  push:
    branches:
      - master
      - rel/*
      - feat/*
  pull_request:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Delete any existing JitPack build for this commit and rebuild it
        type: boolean
        default: false

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-22.04
    concurrency:
      group: jitpack-${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    # Run on releases, pushes, workflow_dispatch, or PRs with the jitpack:build label
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'jitpack:build')
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4

      - name: Determine Version Info
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" == "tag" ]; then
            echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version_type=release" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "version=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "version_type=pull_request" >> "$GITHUB_OUTPUT"
          else
            echo "version=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "version_type=commit" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Artifacts on JitPack
        env:
          JITPACK_TOKEN: ${{ secrets.JITPACK_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/jitpack-build.sh "$VERSION"

      - name: Dispatch SDK bump to test app
        id: test_app_dispatch
        if: success() && github.ref_type == 'tag'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.TEST_APP_DISPATCH_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping dispatch for non-stable tag $TAG_NAME"
            exit 0
          fi
          gh api repos/klaviyo/klaviyo-android-test-app/dispatches \
            -f event_type=sdk-released \
            -f "client_payload[version]=$TAG_NAME"

      - name: Notify Slack of release publish success
        if: success() && github.ref_type == 'tag'
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          package: Android SDK
          platform: JitPack
          version_label: ${{ github.ref_name }}
          release_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          details: ${{ steps.test_app_dispatch.outcome == 'failure' && '⚠️ Test app SDK bump dispatch failed. Bump klaviyo-android-test-app by hand or re-run this job.' || '' }}

      - name: Notify Slack of release publish failure
        if: failure() && github.ref_type == 'tag'
        continue-on-error: true
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          package: Android SDK
          platform: JitPack
          version_label: ${{ github.ref_name }}
          release_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}

      - name: Send Slack notification on success
        if: success() && github.ref_type != 'tag'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ JitPack Build Successful"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "✅ JitPack Artifacts Available for `${{ github.event.pull_request.head.ref || github.ref_name }}` `${{ steps.version.outputs.version }}`\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"

      - name: Send Slack notification on failure
        if: failure() && (github.ref_type != 'tag' || steps.checkout.outcome != 'success')
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 JitPack Build Failed"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨 JitPack Build Failed for `${{ github.event.pull_request.head.ref || github.ref_name }}` `${{ steps.version.outputs.version }}`\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"

      - name: Update PR labels on success
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "jitpack:build"

      - name: Update PR labels on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "jitpack:build"

      - name: Checkout full history for Linear sync
        id: linear-checkout
        if: success() && github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.event.release.prerelease != true
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync release to Linear
        id: linear-sync
        if: success() && github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.event.release.prerelease != true && steps.linear-checkout.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          version: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

      - name: Complete release in Linear
        if: success() && github.ref_type == 'tag' && !contains(github.ref_name, '-') && github.event.release.prerelease != true && steps.linear-sync.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@30f9ae77461ec29f07fffe0c52edd1909bfbb6f5 # v0.18.1
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ github.ref_name }}