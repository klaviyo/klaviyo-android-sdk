name: JitPack

# Required permissions for label management
permissions:
  contents: read
  pull-requests: write

on:
  release:
    types: [ published ]
  push:
    branches:
      - master
      - rel/*
      - feat/*
  pull_request:
    types: [ labeled ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Delete any existing JitPack build for this commit and rebuild it
        type: boolean
        default: false

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-22.04
    concurrency:
      group: jitpack-${{ github.event.release.tag_name || github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    # Run on releases, pushes, workflow_dispatch, or PRs with the jitpack:build label
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'jitpack:build')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version Info
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" == "release" ]; then
            echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "version_type=release" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "version=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "version_type=pull_request" >> "$GITHUB_OUTPUT"
          else
            echo "version=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "version_type=commit" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Artifacts on JitPack
        env:
          JITPACK_TOKEN: ${{ secrets.JITPACK_TOKEN }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/jitpack-build.sh "$VERSION"

      - name: Notify Slack of release publish success
        if: success() && github.event_name == 'release'
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: success
          package: Android SDK
          platform: JitPack
          version_label: ${{ github.event.release.tag_name }}
          release_url: ${{ github.event.release.html_url }}

      - name: Notify Slack of release publish failure
        if: failure() && github.event_name == 'release'
        uses: ./.github/actions/notify-slack-publish
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          result: failure
          package: Android SDK
          platform: JitPack
          version_label: ${{ github.event.release.tag_name }}
          release_url: ${{ github.event.release.html_url }}

      - name: Send Slack notification on success
        if: success() && github.event_name != 'release'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "✅ JitPack Build Successful"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "✅ JitPack Artifacts Available for `${{ github.event.pull_request.head.ref || github.ref_name }}` `${{ steps.version.outputs.version }}`\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"

      - name: Send Slack notification on failure
        if: failure() && github.event_name != 'release'
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "🚨 JitPack Build Failed"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨 JitPack Build Failed for `${{ github.event.pull_request.head.ref || github.ref_name }}` `${{ steps.version.outputs.version }}`\n"
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Workflow Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"

      - name: Update PR labels on success
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "jitpack:build"

      - name: Update PR labels on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --remove-label "jitpack:build"