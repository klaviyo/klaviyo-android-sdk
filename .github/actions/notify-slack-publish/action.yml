name: Notify Slack of publish result
description: Posts a Slack message summarizing a publish or release step.
inputs:
  webhook:
    description: Slack incoming webhook URL
    required: true
  result:
    description: "'success', 'failure', 'pending' or 'stopped'. Drives the icon and default headline."
    required: true
  package:
    description: "Human-readable package label (e.g. 'Android SDK')"
    required: true
  platform:
    description: "Human-readable platform label (e.g. 'JitPack')"
    required: true
  version_label:
    description: Version string to show in the message (e.g. release tag)
    required: false
    default: manual
  title:
    description: "Headline text after the icon. Defaults to <package>: <platform> publish succeeded/failed."
    required: false
    default: ''
  details:
    description: Extra mrkdwn lines appended to the details section
    required: false
    default: ''
  commit:
    description: Commit to show. Defaults to github.sha.
    required: false
    default: ''
  release_url:
    description: Optional link to the GitHub release
    required: false
    default: ''
  install_url:
    description: Optional install link to surface in the message (e.g. internal-sharing download URL). Only useful to users already authorized for the build.
    required: false
    default: ''
  run_label:
    description: Link text for the workflow run
    required: false
    default: View Details

runs:
  using: composite
  steps:
    - id: head
      shell: bash
      env:
        RESULT: ${{ inputs.result }}
        TITLE: ${{ inputs.title }}
        PACKAGE: ${{ inputs.package }}
        PLATFORM: ${{ inputs.platform }}
        VERSION_LABEL: ${{ inputs.version_label }}
        COMMIT: ${{ inputs.commit || github.sha }}
        RELEASE_URL: ${{ inputs.release_url }}
        INSTALL_URL: ${{ inputs.install_url }}
        DETAILS: ${{ inputs.details }}
        REPO: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        ACTOR: ${{ github.actor }}
      run: |
        case "$RESULT" in
          success) icon="✅"; verb="publish succeeded" ;;
          pending) icon="⏳"; verb="awaiting approval" ;;
          stopped) icon="⚠️"; verb="stopped" ;;
          *) icon="🚨"; verb="publish failed" ;;
        esac
        text="$icon ${TITLE:-$PACKAGE: $PLATFORM $verb}"
        text=${text//$'\r'/ }
        text=${text//$'\n'/ }
        body="*Repository:* $REPO"$'\n'"*Workflow:* $WORKFLOW"$'\n'"*Version:* \`$VERSION_LABEL\`"$'\n'"*Commit:* \`$COMMIT\`"$'\n'"*Author:* $ACTOR"
        [ -n "$RELEASE_URL" ] && body+=$'\n'"*Release:* <$RELEASE_URL|$VERSION_LABEL>"
        [ -n "$INSTALL_URL" ] && body+=$'\n'"*Install:* <$INSTALL_URL|Tap to install build>"
        [ -n "$DETAILS" ] && body+=$'\n'"$DETAILS"
        delim="EOF_$(openssl rand -hex 8)"
        {
          echo "text=$text"
          echo "body<<$delim"
          echo "$body"
          echo "$delim"
        } >> "$GITHUB_OUTPUT"

    - uses: slackapi/slack-github-action@v2.1.1
      with:
        webhook: ${{ inputs.webhook }}
        webhook-type: incoming-webhook
        payload: |
          text: ${{ toJSON(steps.head.outputs.text) }}
          blocks:
            - type: "header"
              text:
                type: "plain_text"
                text: ${{ toJSON(steps.head.outputs.text) }}
            - type: "section"
              text:
                type: "mrkdwn"
                text: ${{ toJSON(steps.head.outputs.body) }}
            - type: "section"
              text:
                type: "mrkdwn"
                text: ${{ toJSON(format('*Workflow Run:* <{0}/{1}/actions/runs/{2}|{3}>', github.server_url, github.repository, github.run_id, inputs.run_label)) }}
